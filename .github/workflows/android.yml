name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Runner ubuntu-latest sudah menyertakan Android SDK beserta lisensi yang
      # sudah diterima. Aksi android-actions/setup-android tidak dipakai karena
      # kini gagal: ia mencoba memasang paket "tools" yang sudah dihapus dari
      # repositori SDK ("Failed to find package 'tools'").
      - name: Info Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          echo "platforms:"; ls -1 "$SDK/platforms" 2>/dev/null || true
          echo "build-tools:"; ls -1 "$SDK/build-tools" 2>/dev/null || true

      - name: Pastikan platform android-34 (best effort)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          MANAGER=$(command -v sdkmanager || true)
          if [ -z "$MANAGER" ]; then
            MANAGER=$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          fi
          if [ -n "$MANAGER" ]; then
            yes | "$MANAGER" --licenses > /dev/null 2>&1 || true
            "$MANAGER" "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "sdkmanager tidak ditemukan — AGP akan memakai SDK yang sudah ada"
          fi

      - name: Build
        run: |
          chmod +x gradlew 2>/dev/null || true
          if ./gradlew --version > /dev/null 2>&1; then
            echo "::notice::wrapper ./gradlew berfungsi"
            ./gradlew assembleDebug --no-daemon
          else
            echo "::warning::wrapper tidak jalan, memakai Gradle dari action"
            gradle assembleDebug --no-daemon
          fi

      - name: Tampilkan APK yang dihasilkan
        run: ls -lh app/build/outputs/apk/debug/

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: korean-quiz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Buat Release (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/debug/*.apk \
            --title "Korean Quiz ${GITHUB_REF_NAME}" \
            --generate-notes
